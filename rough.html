<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Portal | Gateway</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc, #cfdef3); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        nav { background: #0f172ad9; backdrop-filter: blur(12px); padding: 14px 30px; border-radius: 80px; margin-bottom: 30px; display: flex; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        nav a { color: white; text-decoration: none; padding: 8px 20px; border-radius: 40px; transition: 0.3s; cursor: pointer; }
        nav a:hover { background: #f97316; color: #0f172a; }

        .section { display: none; background: white; max-width: 500px; width: 100%; padding: 40px; border-radius: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .active { display: block; animation: fadeIn 0.5s; }

        h1, h2 { color: #0f2b3d; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        button { background: #1e2b3c; color: white; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background: #f97316; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav>
    <a onclick="show('home')">🏠 Home</a>
    <a onclick="show('login')">🔐 Login</a>
    <a onclick="show('register')">📝 Register</a>
</nav>

<div id="home" class="section active">
    <h1>🎓 Student Portal</h1>
    <p>Empowering students with agile learning solutions and real-time progress tracking.</p>
    <button onclick="show('login')">Get Started</button>
</div>

<div id="login" class="section">
    <h2>Welcome Back</h2>
    <input type="text" id="user" placeholder="Email or Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
</div>

<div id="register" class="section">
    <h2>Create Account</h2>
    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button onclick="alert('Registration Successful! Please Login.')">Register</button>
</div>

<script>
    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function handleLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u && p) {
            window.location.href = 'dashboard.html';
        } else {
            alert('Please fill in credentials');
        }
    }
</script>
</body>
</html>
