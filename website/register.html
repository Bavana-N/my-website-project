<!DOCTYPE html>
<html>
<head>
  <title>Register | Student Portal</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', system-ui, 'Segoe UI', 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #d9e2ef 0%, #c2d0e6 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Navigation Bar - consistent with other pages */
    nav {
      background: #0f172ad9;
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 12px 28px;
      border-radius: 80px;
      margin-bottom: 40px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
      position: sticky;
      top: 20px;
      z-index: 100;
      width: fit-content;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
    }

    nav a {
      color: #f1f5f9;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 18px;
      border-radius: 40px;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    nav a:hover {
      background: #f97316;
      color: #0f172a;
      transform: scale(1.02);
    }

    /* Main container card */
    .container {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      max-width: 520px;
      width: 100%;
      margin: 10px auto;
      padding: 40px 32px 48px;
      border-radius: 64px 36px 64px 36px;
      text-align: center;
      box-shadow: 0 30px 45px rgba(0, 0, 0, 0.2);
      transition: transform 0.25s;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .container:hover {
      transform: translateY(-5px);
    }

    /* Icon styling */
    .register-icon {
      width: 85px;
      margin-bottom: 12px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
    }

    h2 {
      font-size: 2.2rem;
      background: linear-gradient(125deg, #0f2b3d, #10b981);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .sub-text {
      font-size: 0.85rem;
      color: #2c3e66;
      background: #e6f7ec;
      display: inline-block;
      padding: 6px 20px;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    /* Input fields */
    input {
      width: 85%;
      padding: 14px 20px;
      margin: 10px 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 60px;
      font-size: 1rem;
      background: white;
      transition: all 0.2s;
      outline: none;
      color: #1e293b;
      font-weight: 500;
    }

    input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      transform: scale(1.01);
    }

    /* Button */
    button {
      background: linear-gradient(95deg, #1e2b3c, #0f2b3d);
      border: none;
      padding: 12px 38px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 60px;
      color: white;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
      margin-top: 16px;
      width: 85%;
      letter-spacing: 1px;
    }

    button:hover {
      background: linear-gradient(95deg, #10b981, #059669);
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
      color: white;
    }

    /* Login link */
    .login-link {
      margin-top: 28px;
      font-size: 0.9rem;
      color: #334155;
    }

    .login-link a {
      color: #10b981;
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px dashed #10b981;
    }

    .login-link a:hover {
      color: #059669;
      border-bottom: 1px solid;
    }

    /* Message styling */
    .message {
      margin-top: 18px;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 50px;
      width: 85%;
      margin-left: auto;
      margin-right: auto;
      transition: 0.2s;
    }

    .error-msg {
      background: #fee2e2;
      color: #b91c1c;
      border-left: 4px solid #ef4444;
    }

    .success-msg {
      background: #dcfce7;
      color: #166534;
      border-left: 4px solid #22c55e;
    }

    /* Responsive */
    @media (max-width: 550px) {
      .container {
        padding: 32px 18px;
      }
      h2 {
        font-size: 1.8rem;
      }
      input, button {
        width: 92%;
      }
      nav a {
        padding: 4px 12px;
        font-size: 0.8rem;
      }
    }

    /* Decorative background */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.08), transparent);
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="login.html">🔐 Login</a>
  <a href="register.html">📝 Register</a>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="about.html">ℹ️ About</a>
  <a href="contact.html">📞 Contact</a>
</nav>

<div class="container">
  <!-- Registration Icon -->
  <img class="register-icon" 
       src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" 
       alt="Register Icon"
       width="80">

  <h2>📝 Create Your Account</h2>
  <div class="sub-text">🚀 Start your agile learning journey</div>

  <p style="font-size:14px; opacity:0.75; margin-bottom: 15px;">
    Join our Student Portal to manage your courses, track progress, 
    and stay updated with your academic activities.
  </p>

  <input type="text" id="fullName" placeholder="👤 Full Name" autocomplete="name">
  <input type="email" id="email" placeholder="📧 Email Address" autocomplete="email">
  <input type="password" id="password" placeholder="🔒 Password (min 6 characters)">
  <input type="password" id="confirmPassword" placeholder="✅ Confirm Password">

  <button onclick="register()">📋 Register</button>

  <div id="registerMessage" class="message"></div>

  <div class="login-link">
    Already have an account? 
    <a href="login.html">Login here</a>
  </div>
</div>

<!-- background decoration -->
<div class="bg-blob" style="width: 280px; height: 280px; top: -60px; right: -70px;"></div>
<div class="bg-blob" style="width: 220px; height: 220px; bottom: -40px; left: -50px;"></div>

<script>
  function register() {
    let fullName = document.getElementById('fullName').value.trim();
    let email = document.getElementById('email').value.trim();
    let password = document.getElementById('password').value;
    let confirmPwd = document.getElementById('confirmPassword').value;
    let messageDiv = document.getElementById('registerMessage');

    // Reset message
    messageDiv.innerHTML = "";
    messageDiv.className = "message";

    // Validation checks
    if (fullName === "" || email === "" || password === "" || confirmPwd === "") {
      messageDiv.innerHTML = "⚠️ All fields are required!";
      messageDiv.className = "message error-msg";
      return;
    }

    // Name validation (at least 3 characters)
    if (fullName.length < 3) {
      messageDiv.innerHTML = "❌ Full name must be at least 3 characters long.";
      messageDiv.className = "message error-msg";
      return;
    }

    // Email format basic check
    const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
    if (!emailPattern.test(email)) {
      messageDiv.innerHTML = "❌ Please enter a valid email address (e.g., name@example.com).";
      messageDiv.className = "message error-msg";
      return;
    }

    // Password strength
    if (password.length < 6) {
      messageDiv.innerHTML = "❌ Password must be at least 6 characters long.";
      messageDiv.className = "message error-msg";
      return;
    }

    // Confirm password match
    if (password !== confirmPwd) {
      messageDiv.innerHTML = "❌ Passwords do not match. Please re-enter.";
      messageDiv.className = "message error-msg";
      return;
    }

    // If all valid, simulate registration success
    // Store minimal user data in sessionStorage for demo
    let userData = {
      name: fullName,
      email: email,
      registeredOn: new Date().toLocaleString()
    };
    sessionStorage.setItem("registeredUser", JSON.stringify(userData));
    sessionStorage.setItem("isRegistered", "true");

    messageDiv.innerHTML = "✅ Registration successful! Redirecting to Login page...";
    messageDiv.className = "message success-msg";

    // Redirect to login after 1.5 seconds
    setTimeout(function() {
      window.location.href = "login.html";
    }, 1500);
  }

  // Optional: If user already registered and lands on register page, show helpful message?
  window.onload = function() {
    // clear any old message
    let msgDiv = document.getElementById('registerMessage');
    if(msgDiv) msgDiv.innerHTML = "";
  };
</script>

</body>
</html>
